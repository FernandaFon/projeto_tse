services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql_tse
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:?defina MSSQL_SA_PASSWORD no .env}
      - MSSQL_PID=Developer
    ports:
      - "127.0.0.1:${MSSQL_PORT:-1433}:1433"  # <--- Força o bind direto no loopback do host
    volumes:
      # Volume nomeado (e não uma pasta do projeto): evita erro de permissão no Linux e
      # incompatibilidades do SQL Server com pastas do Windows no Docker Desktop.
      # Apagar o banco: docker compose down -v
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q \"SELECT 1\" -o /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

  # Pipeline completo dentro de um container (Python + ODBC já instalados).
  # Use pelos scripts iniciar.sh / iniciar.bat, ou: docker compose run --rm --build pipeline
  pipeline:
    build: .
    profiles: ["pipeline"]  # não sobe com um simples "docker compose up"
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:?defina MSSQL_SA_PASSWORD no .env}
      - MSSQL_HOST=sqlserver
      - MSSQL_PORT=1433
      - MSSQL_DATABASE=${MSSQL_DATABASE:-tse_warehouse}
      - TSE_ANO=${TSE_ANO:-2022}
    # No Linux, grava data/ com o seu usuário (o iniciar.sh exporta HOST_UID/HOST_GID)
    user: "${HOST_UID:-0}:${HOST_GID:-0}"
    volumes:
      - .:/app

volumes:
  mssql_data:
